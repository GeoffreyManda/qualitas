{
  "project": "qualitas",
  "purpose": "General-purpose data quality assessment package for R: a data specification, more than thirty checks mapped to ISO/IEC 25012, Kahn et al. 2016 and the dataquieR framework, measures as numerator, denominator and ratio, a cleaning log, and HTML, Word and JSON reports.",
  "version_control": "git, one branch (main)",
  "layout": "Standard R package in the layout of rcompendium and R Packages (Wickham and Bryan): DESCRIPTION, NAMESPACE, R/, man/, tests/, inst/, vignettes/, README.Rmd, NEWS.md, _pkgdown.yml, .github/workflows, with an agent skill in inst/skill/",
  "defaults": {
    "typeface": "Times New Roman for reports, set in the report template",
    "naming": "snake_case R files and functions; one family of checks per file; files of at most 100 code lines"
  },
  "active_files": [
    "repo-manifest.yaml",
    ".gitignore",
    ".Rbuildignore",
    ".lintr",
    "DESCRIPTION",
    "NAMESPACE",
    "LICENSE",
    "README.md",
    "NEWS.md",
    "qualitas.Rproj",
    "R/**",
    "man/**",
    "tests/**",
    "inst/**",
    ".github/**",
    "plan.md",
    "vignettes/**",
    "cran-comments.md",
    "inst/extdata/README.md",
    "outputs/qualitas-manual.pdf",
    "outputs/qualitas_0.1.0.tar.gz",
    "outputs/qualitas_0.1.1.tar.gz",
    "manuscript/**",
    "outputs/qualitas-article-*",
    "outputs/qualitas-authoring-integration.json",
    "outputs/qualitas-qc.json",
    "outputs/qualitas-qc.md"
  ],
  "files": {
    "R/**": {
      "role": "Package code: specification, checks, engine, measures, cleaning log, reports",
      "phase": "package-code"
    },
    "tests/**": {
      "role": "testthat tests on made-up data with planted defects",
      "phase": "package-test"
    },
    "inst/bin/**": {
      "role": "Command-line entry point",
      "phase": "package-cli"
    },
    "inst/catalogue/**": {
      "role": "The catalogue of checks, as data"
    },
    "inst/extdata/**": {
      "role": "Made-up example data with known defects"
    },
    "inst/skill/**": {
      "role": "Agent skill: how to run a data quality assessment with qualitas"
    },
    "inst/CITATION": {
      "role": "How to cite the package"
    },
    ".github/**": {
      "role": "Continuous integration: R CMD check on push and pull request",
      "phase": "package-ci"
    },
    "man/**": {
      "role": "Help pages generated by roxygen2"
    },
    "tests/testthat.R": {
      "role": "Runs the testthat suite under R CMD check",
      "phase": "package-test-runner"
    },
    "plan.md": {
      "role": "qualitas plan: objective, steps, writing plan and authoring bindings (internal, not tracked by git, not built)"
    },
    "inst/benchmark/**": {
      "role": "Benchmark: assesses a random sample of public data sets from the Rdatasets archive and records errors, timing and flag rates",
      "phase": "package-benchmark"
    },
    "vignettes/**": {
      "role": "Executable getting-started vignette for package users",
      "phase": "package-documentation"
    },
    "cran-comments.md": {
      "role": "First CRAN submission notes and actual check results; excluded from package archive"
    },
    "outputs/qualitas-manual.pdf": {
      "role": "Current PDF reference manual for review; generated and untracked"
    },
    "outputs/qualitas_0.1.0.tar.gz": {
      "role": "Current source submission archive for review; generated and untracked"
    },
    "manuscript/**": {
      "role": "Canonical Journal of Statistical Software manuscript source, verified bibliography, executable replication and generated article figures/PDF; excluded from the CRAN package archive",
      "phase": "package-article"
    },
    "outputs/qualitas-article-*": {
      "role": "Internal manuscript evidence, purpose, academic review and authoring diagnostics"
    }
  },
  "governance": {
    "anti_sprawl": {
      "phase_entrypoints": {
        "package-code": "R/",
        "package-test": "tests/testthat/",
        "package-test-runner": "tests/testthat.R",
        "package-cli": "inst/bin/",
        "package-benchmark": "inst/benchmark/",
        "package-article": "manuscript/code.R"
      }
    }
  }
}
